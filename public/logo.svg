<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 8 238 118" width="476" height="236">
  <defs>
    <linearGradient id="s0" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2f5fc4"/>
      <stop offset="1" stop-color="#6a9cf5"/>
    </linearGradient>
    <linearGradient id="s1" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1f3f86"/>
      <stop offset="1" stop-color="#4a7fe0"/>
    </linearGradient>
    <linearGradient id="s2" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#142a58"/>
      <stop offset="1" stop-color="#2f5bb0"/>
    </linearGradient>
    <linearGradient id="s3" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0d1a33"/>
      <stop offset="1" stop-color="#1c3570"/>
    </linearGradient>
    <linearGradient id="tri" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#5c95f2"/>
      <stop offset="1" stop-color="#2b5fd6"/>
    </linearGradient>
  </defs>

  <!-- Four streams, 8 thick on a 12 pitch. Right ends span y 18 to 62. -->
  <g fill="none" stroke-width="8" stroke-linecap="butt">
    <path stroke="url(#s0)" d="M20 76 H90 C140 76 140 22 188 22"/>
    <path stroke="url(#s1)" d="M20 88 H90 C140 88 140 34 188 34"/>
    <path stroke="url(#s2)" d="M20 100 H90 C140 100 140 46 188 46"/>
    <path stroke="url(#s3)" d="M20 112 H90 C140 112 140 58 188 58"/>
  </g>

  <!-- Play triangle: outer extent y 18 to 62, centred on y 40 like the stream ends. -->
  <polygon points="199,21 199,59 233,40" fill="url(#tri)" stroke="url(#tri)"
           stroke-width="6" stroke-linejoin="round"/>
</svg>
